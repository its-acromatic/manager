<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manager">
  <title>Manager - Settings</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/global.css">
</head>
<body>
  <button class="menu-toggle" type="button" aria-label="Open navigation">☰</button>
  <aside class="sidebar">
    <h1 class="logo">Manager</h1>
    <button class="sidebar-close" type="button" aria-label="Close navigation">×</button>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="calendar.html">Calendar</a>
      <a href="attendance.html">Attendance</a>
      <a href="analytics.html">Analytics</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>
  <main class="main-content">
    <header class="topbar"><h2>Settings</h2></header>
    <section class="widget">
      <h3>Authentication</h3>
      <div class="panel-block">
        <p class="muted">Sign in with email/password to access your personal data.</p>

        <div id="auth-forms">
          <div id="auth-signedout">
            <p class="muted">You are not signed in. Access is restricted — sign in is required.</p>
          </div>

          <div id="auth-signedin" class="auth-row hidden">
            <div class="auth-user" id="auth-user">Signed in</div>
            <button id="signout" class="primary">Sign Out</button>
          </div>
        </div>

        <p id="auth-status" class="muted status-text"></p>
      </div>
    </section>
    <section class="widget spaced-section">
      <h3>Session Settings</h3>
      <div class="settings-panel">
        <label class="muted">Session Start</label>
        <input id="session-start" type="date" />
        <label class="muted">Session End</label>
        <input id="session-end" type="date" />
        <label class="muted">Required Attendance (%)</label>
        <input id="required-percent" type="number" min="0" max="100" value="75" />
        <div class="action-row">
          <button id="save-session" class="primary">Save Session</button>
          <button id="seed-defaults" class="ghost">Seed Defaults</button>
          <div id="session-status" class="muted session-status"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/settings/settings.js"></script>
  <script type="module" src="js/app.js" defer></script>
</body>
</html>
