<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manager">
  <title>Manager</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/spotlight.css">

  <script type="module" src="js/app.js" defer></script>
</head>
<body>
  <button class="menu-toggle" type="button" aria-label="Open navigation">☰</button>

  <aside class="sidebar">
    <h1 class="logo">Manager</h1>
    <button class="sidebar-close" type="button" aria-label="Close navigation">×</button>

    <nav>
      <a href="index.html">Dashboard</a>
      <a href="calendar.html">Calendar</a>
      <a href="attendance.html">Attendance</a>
      <a href="tasks.html">Tasks</a>
      <a href="focus.html">Focus</a>
      <a href="analytics.html">Analytics</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>

  <main class="main-content">

    <header class="topbar">
      <div>
        <h2>Dashboard</h2>
        <p id="today-date"></p>
      </div>
    </header>

    <section class="dashboard-grid">

      <div class="widget attendance-widget">
        <h3>Attendance</h3>
        <div class="attendance-percent" id="attendance-percent">--%</div>
        <p id="attendance-info">Loading...</p>
      </div>

      <div class="widget current-event-widget">
        <h3>Today's Events</h3>
        <ul id="today-events-list"></ul>
      </div>

      <div class="widget events-widget">
        <h3>Upcoming Events</h3>
        <ul id="events-list"></ul>
      </div>

      <div class="widget tasks-widget">
        <h3>Pending Tasks</h3>
        <div class="tasks-widget-body">
          <ul id="dashboard-tasks-list"></ul>
          <a href="tasks.html" style="color:var(--primary);font-size:0.85rem;margin-top:12px;display:inline-block;text-decoration:none">View all →</a>
        </div>
      </div>

    </section>

  </main>

</body>
</html>
