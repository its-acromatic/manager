<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminders — Manager</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/reminders.css">
  <link rel="stylesheet" href="css/spotlight.css">
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-header">
      <h1>Manager</h1>
      <button class="sidebar-close" aria-label="Close menu">✕</button>
    </div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="attendance.html">Attendance</a>
      <a href="calendar.html">Calendar</a>
      <a href="tasks.html">Tasks</a>
      <a href="reminders.html" class="active">Reminders</a>
      <a href="focus.html">Focus</a>
      <a href="analytics.html">Analytics</a>
      <a href="settings.html">Settings</a>
    </nav>
  </nav>

  <button class="menu-toggle" aria-label="Open menu">☰</button>

  <main class="container">
    <div class="page-header">
      <h1>Reminders</h1>
      <p style="color:var(--secondary);margin-top:4px">Saved reminders and exams live here. Delete or archive items when they are done.</p>
    </div>

    <div class="tasks-filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="reminder">Reminders</button>
      <button class="filter-btn" data-filter="exam">Exams</button>
    </div>

    <div id="reminders-summary" style="color:var(--secondary);margin-bottom:18px">Loading...</div>

    <div id="reminders-container" class="reminders-container">
      <div style="text-align:center;color:var(--secondary);padding:40px">Loading reminders...</div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { initRemindersPage, loadRemindersPage } from './js/reminders/reminders.js';
    import { subscribeAuth } from './js/firebase.js';

    function initMobileNav() {
      const menuToggle = document.querySelector('.menu-toggle');
      const sidebar = document.querySelector('.sidebar');
      const sidebarClose = document.querySelector('.sidebar-close');

      const closeSidebar = () => {
        if (sidebar) sidebar.classList.remove('open');
      };

      if (menuToggle && sidebar) {
        menuToggle.addEventListener('click', () => sidebar.classList.add('open'));
      }
      if (sidebarClose) {
        sidebarClose.addEventListener('click', closeSidebar);
      }

      document.addEventListener('click', (e) => {
        if (!sidebar?.classList.contains('open')) return;
        if (sidebar.contains(e.target) || e.target === menuToggle) return;
        closeSidebar();
      });
    }

    initMobileNav();
    initRemindersPage();

    subscribeAuth((user) => {
      const uid = user ? user.uid : null;
      loadRemindersPage(uid);
    });
  </script>
</body>
</html>
